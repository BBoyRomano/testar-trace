[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "reqtrace"
version = "0.1.0"
description = "Core models and traceability analysis for ReqTrace."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "R. J. H. van de Wetering" },
]
keywords = [
  "requirements",
  "traceability",
  "analysis",
  "testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BBoyRomano/testar-requirements-traceability"
Repository = "https://github.com/BBoyRomano/testar-requirements-traceability"
Documentation = "https://github.com/BBoyRomano/testar-requirements-traceability/tree/main/docs"
Issues = "https://github.com/BBoyRomano/testar-requirements-traceability/issues"
