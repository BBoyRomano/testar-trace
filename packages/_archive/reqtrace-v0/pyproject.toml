[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "reqtrace-old"
version = "0.1.0"
description = "Archived legacy ReqTrace package kept for reference only."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R. J. H. van de Wetering" }]
keywords = ["requirements", "traceability", "gui-testing", "testar", "thesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.12,<3",
]

[dependency-groups]
build = [
  "pyinstaller>=6.19,<7",
]
lint = [
  "ruff>=0.15,<1",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]
typecheck = [
  "ty>=0.0.29,<1",
]
interfaces = [
  "reqtrace-api",
  "reqtrace-cli",
  "reqtrace-desktop",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typecheck" },
  { include-group = "interfaces" },
  "pre-commit>=4.5,<5",
]

[tool.uv.workspace]
members = [".", "apps/api", "apps/cli", "apps/desktop"]

[tool.uv.sources]
reqtrace-api = { workspace = true }
reqtrace-cli = { workspace = true }
reqtrace-desktop = { workspace = true }

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "apps/api/src", "apps/cli/src", "apps/desktop/src"]
addopts = [
  "-ra",
  "--import-mode=importlib",
]
strict_config = true
strict_markers = true
markers = [
  "integration: tests that exercise component integration and I/O boundaries",
  "interface: tests for optional CLI/desktop/API interfaces",
]
xfail_strict = true

[tool.ty.environment]
root = ["./src", "./apps/api/src", "./apps/cli/src", "./apps/desktop/src"]

