[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "reqtrace-cli-old"
version = "0.1.0"
description = "Archived legacy CLI for ReqTrace reference only."
requires-python = ">=3.14"
dependencies = [
  "reqtrace>=0.1.0",
  "rich>=14.3,<15",
  "typer>=0.24,<1",
]

[project.scripts]
reqtrace-legacy = "reqtrace_cli.main:main"

[tool.uv.sources]
reqtrace = { workspace = true }
