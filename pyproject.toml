[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "reqtrace"
version = "0.1.0"
description = "Requirements traceability for scriptless GUI testing."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "R. J. H. van de Wetering" }]
keywords = ["requirements", "traceability", "gui-testing", "testar", "thesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.12,<3",
  "rich>=14.3,<15",
  "typer>=0.24,<1",
]

[project.scripts]
reqtrace = "reqtrace.cli:main"

[project.gui-scripts]
reqtrace-gui = "reqtrace.gui:main"

[dependency-groups]
build = [
  "pyinstaller>=6.19,<7",
]
lint = [
  "ruff>=0.15,<1",
]
test = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
]
typecheck = [
  "ty>=0.0.29,<1",
]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "typecheck" },
  "pre-commit>=4.5,<5",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--import-mode=importlib",
]
markers = [
  "integration: tests that exercise component integration and I/O boundaries",
]
strict_xfail = true
