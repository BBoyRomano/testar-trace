[project]
name = "testar-trace-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false
required-version = ">=0.12.1,<0.13"
preview-features = ["audit-command", "check-command", "format-command"]

[tool.uv.workspace]
members = ["packages/core", "packages/adapters", "apps/cli"]

[tool.uv.sources]
testar-trace = { workspace = true }
testar-trace-adapters = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1,<8", "ruff>=0.16.1,<0.17", "ty>=0.0.65,<0.1"]

[tool.pytest]
minversion = "9.1"
addopts = ["-ra", "--import-mode=importlib"]
strict = true
testpaths = ["packages/core/tests", "packages/adapters/tests", "apps/cli/tests"]

[tool.ruff]
src = ["packages/core/src", "packages/adapters/src", "apps/cli/src"]
extend-exclude = ["benchmarks", "_archive"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
exclude = ["benchmarks/**", "_archive/**"]

[tool.ty.environment]
root = ["./packages/core/src", "./packages/adapters/src", "./apps/cli/src"]

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/adapters/src", "apps/cli/src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
