[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reqtrace"
version = "0.1.0"
description = "Requirements traceability for scriptless GUI testing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "R. J. H. van de Wetering" }]
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[project.scripts]
reqtrace = "reqtrace.presentation.cli.main:main"
reqtrace-gui = "reqtrace.presentation.gui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
