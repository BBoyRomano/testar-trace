[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "reqtrace-api"
version = "0.1.0"
description = "HTTP API for ReqTrace web and desktop applications."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "R. J. H. van de Wetering" },
]
dependencies = [
  "reqtrace>=0.1.0,<0.2.0",
  "reqtrace-adapters>=0.1.0,<0.2.0",
]

[project.scripts]
reqtrace-api = "reqtrace_api.server:main"
