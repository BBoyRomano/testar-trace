[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "testar-trace-cli"
version = "0.1.0"
description = "Command-line interface for TESTAR Trace."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Romano van de Wetering" }]
keywords = [
  "requirements traceability",
  "requirements completeness",
  "scriptless GUI testing",
  "GUI state models",
  "TESTAR",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
    "rich>=15,<16",
    "testar-trace>=0.1.0,<0.2.0",
    "testar-trace-adapters>=0.1.0,<0.2.0",
    "typer>=0.27,<0.28",
]
import-names = ["testar_trace_cli"]

[project.scripts]
testar-trace = "testar_trace_cli.main:main"

[project.urls]
Repository = "https://github.com/BBoyRomano/testar-trace"
