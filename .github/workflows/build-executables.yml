name: Build Executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-executables:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build CLI executable
        run: pyinstaller packaging/pyinstaller/reqtrace-cli.spec

      - name: Build GUI executable
        run: pyinstaller packaging/pyinstaller/reqtrace-gui.spec

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqtrace-cli-windows
          path: dist/reqtrace/**

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: reqtrace-gui-windows
          path: dist/reqtrace-gui/**
