name: Build Executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-executables:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-latest
            cli_executable: dist/reqtrace.exe
            desktop_executable: dist/reqtrace-desktop.exe
          - name: macos
            os: macos-latest
            cli_executable: dist/reqtrace
            desktop_executable: dist/reqtrace-desktop
          - name: linux-x64
            os: ubuntu-latest
            cli_executable: dist/reqtrace
            desktop_executable: dist/reqtrace-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --group build --locked

      - name: Build CLI executable
        run: uv run pyinstaller packaging/pyinstaller/reqtrace-cli.spec

      - name: Build Desktop executable
        run: uv run pyinstaller packaging/pyinstaller/reqtrace-desktop.spec

      - name: Smoke test CLI executable
        run: |
          python -c "import subprocess; subprocess.run(['${{ matrix.target.cli_executable }}', '--help'], check=True)"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: reqtrace-cli-${{ matrix.target.name }}
          path: ${{ matrix.target.cli_executable }}

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: reqtrace-desktop-${{ matrix.target.name }}
          path: ${{ matrix.target.desktop_executable }}

