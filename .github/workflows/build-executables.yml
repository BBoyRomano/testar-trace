name: Build Executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-executables:
    name: Build (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows-x64
            os: windows-latest
            cli_executable: dist/reqtrace.exe
            gui_executable: dist/reqtrace-gui.exe
          - name: macos
            os: macos-latest
            cli_executable: dist/reqtrace
            gui_executable: dist/reqtrace-gui
          - name: linux-x64
            os: ubuntu-latest
            cli_executable: dist/reqtrace
            gui_executable: dist/reqtrace-gui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build CLI executable
        run: pyinstaller packaging/pyinstaller/reqtrace-cli.spec

      - name: Build GUI executable
        run: pyinstaller packaging/pyinstaller/reqtrace-gui.spec

      - name: Smoke test CLI executable
        run: |
          python -c "import subprocess; subprocess.run(['${{ matrix.target.cli_executable }}', '--help'], check=True)"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v6
        with:
          name: reqtrace-cli-${{ matrix.target.name }}
          path: ${{ matrix.target.cli_executable }}

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v6
        with:
          name: reqtrace-gui-${{ matrix.target.name }}
          path: ${{ matrix.target.gui_executable }}
