name: Deploy web

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://testar-trace.bboyromano.workers.dev/

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install Python dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Install web dependencies
        working-directory: apps/web
        run: vp install --frozen-lockfile

      - name: Build production application
        working-directory: apps/web
        run: vp run build

      - name: Check bundle budgets
        working-directory: apps/web
        run: vp run check:bundle

      - name: Validate Cloudflare deployment
        working-directory: apps/web
        run: vp run deploy:check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers Static Assets
        working-directory: apps/web
        run: vp run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
