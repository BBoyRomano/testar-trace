name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov=reqtrace --cov-report=term-missing -q

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        working-directory: apps/web
        run: vp install

      - name: Check
        working-directory: apps/web
        run: vp check

      - name: Build
        working-directory: apps/web
        run: vp build
