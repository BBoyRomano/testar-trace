name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Check workspace packages
        run: uv check --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv format --check

      - name: Typecheck
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing -q

      - name: Build packages
        run: uv build --all-packages

      - name: Audit Python dependencies
        run: uv audit

      - name: Performance smoke benchmark
        if: matrix.python-version == '3.14'
        run: >-
          uv run python scripts/benchmark_traceability.py
          --repeat 3
          --max-analysis-seconds 10

  python-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-packages --all-groups --locked

      - name: Test Windows behavior
        run: uv run pytest -q

      - name: Smoke test CLI
        run: uv run testar-trace --version

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install dependencies
        working-directory: apps/web
        run: vp install

      - name: Audit web dependencies
        working-directory: apps/web
        run: vp exec pnpm audit

      - name: Check
        working-directory: apps/web
        run: vp check

      - name: Unit tests and coverage
        working-directory: apps/web
        run: vp run test:coverage

      - name: Build
        working-directory: apps/web
        run: vp run build

      - name: Check bundle budgets
        working-directory: apps/web
        run: vp run check:bundle

      - name: Install browser
        working-directory: apps/web
        run: vp exec playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        working-directory: apps/web
        run: vp run test:e2e:prepared

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
